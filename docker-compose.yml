services:     # Набор подключаемых сервисов
  db:         # Сервис с базой данных
    image: pgvector/pgvector:pg17     # Использую 17 версию как наиболее стабильную
    container_name: pgvector-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data